name: Deploy NAQAA Field Lab

on:
  push:
    branches: [main]
    paths:
      - "field-lab/**"
      - ".github/workflows/deploy-field-lab.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "field-lab-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Field Lab site
        uses: actions/upload-pages-artifact@v3
        with:
          path: field-lab
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy NAQAA static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Include NAQAA Field Lab under its own site path
        run: |
          set -euo pipefail
          test -f field-lab/index.html
          mkdir -p static/field-lab
          cp -a field-lab/. static/field-lab/
      - name: Configure GitHub Pages for this repository
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./static
      - uses: actions/deploy-pages@v4

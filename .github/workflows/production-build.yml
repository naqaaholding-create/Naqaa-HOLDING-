name: Production build validation
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
  field-lab-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Capacitor web assets
        run: mkdir -p www && cp *.html *.css *.js www/ 2>/dev/null || true
      - name: Validate web assets
        run: test -s www/index.html
      - name: Check Capacitor configuration
        run: npx cap doctor

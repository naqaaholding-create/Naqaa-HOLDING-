name: Build NAQAA Field Lab Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-lab
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require Android release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS repository secret"; exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD repository secret"; exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp *.html *.css *.js www/
          test -s www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync app assets
        run: npx cap sync android

      - name: Configure release signing safely
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          test -s android/release-keystore.jks
          keytool -list -keystore android/release-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > android/keystore.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("Expected android/app/build.gradle was not generated.")
          s = p.read_text()
          if "signingConfigs {" in s:
              raise SystemExit("Signing config already exists; refusing to patch twice.")
          if not re.search(r"android\s*\{", s):
              raise SystemExit("No android { } block found in generated Gradle file.")

          props = '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          '''
          s = props + s
          s = re.sub(
              r"(android\s*\{)",
              r"""\1
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }
          """,
              s,
              count=1,
          )

          release_match = re.search(r"release\s*\{", s)
          if not release_match:
              s = re.sub(
                  r"(buildTypes\s*\{)",
                  r"\1\n        release { signingConfig signingConfigs.release }",
                  s,
                  count=1,
              )
          else:
              # The first release block after signingConfigs is the signing config itself.
              # Patch the buildTypes release block specifically.
              bt = re.search(r"buildTypes\s*\{", s)
              if not bt:
                  raise SystemExit("No buildTypes block found.")
              tail = s[bt.end():]
              rel = re.search(r"release\s*\{", tail)
              if not rel:
                  s = s[:bt.end()] + "\n        release { signingConfig signingConfigs.release }" + s[bt.end():]
              else:
                  start = bt.end() + rel.end()
                  s = s[:start] + "\n            signingConfig signingConfigs.release" + s[start:]
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: field-lab/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package: name='com.naqaaholding.fieldlab'"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: naqaa-field-lab-signed-release-apk
          path: field-lab/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        working-directory: field-lab
        run: rm -f android/release-keystore.jks android/keystore.properties

name: Deploy NAQAA Field Lab to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-d1-api-setup
    paths:
      - "field-lab/cloudflare/**"

permissions:
  contents: read

concurrency:
  group: naqaa-field-lab-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Worker JavaScript syntax
        run: node --check field-lab/cloudflare/src/index.js

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository variable."; exit 1; }

      - name: Find or create D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          list="$(curl --fail-with-body --silent --show-error "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          id="$(printf '%s' "$list" | jq -r '.result[]? | select(.name == "naqaa-field-lab-db") | .uuid' | head -n 1)"
          if [ -z "$id" ]; then
            created="$(curl --fail-with-body --silent --show-error -X POST "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"naqaa-field-lab-db"}')"
            id="$(printf '%s' "$created" | jq -r '.result.uuid // empty')"
          fi
          test -n "$id" || { echo "::error::Could not find or create the D1 database. Check the token permissions."; exit 1; }
          echo "database_id=$id" >> "$GITHUB_OUTPUT"

      - name: Configure deployment file
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          cd field-lab/cloudflare
          jq --arg id "$DATABASE_ID" --arg account "$CLOUDFLARE_ACCOUNT_ID" '.account_id=$account | .d1_databases[0].database_id=$id' wrangler.jsonc > wrangler.deploy.jsonc

      - name: Apply database schema
        run: npx wrangler d1 execute naqaa-field-lab-db --remote --file=field-lab/cloudflare/schema.sql --config=field-lab/cloudflare/wrangler.deploy.jsonc

      - name: Deploy Worker
        run: npx wrangler deploy --config=field-lab/cloudflare/wrangler.deploy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create JWT secret only if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secrets="$(npx wrangler secret list --name naqaa-field-lab-api --config=field-lab/cloudflare/wrangler.deploy.jsonc)"
          if ! printf '%s' "$secrets" | jq -e 'any(.[]?; .name == "JWT_SECRET")' >/dev/null; then
            openssl rand -hex 32 | npx wrangler secret put JWT_SECRET --name naqaa-field-lab-api --config=field-lab/cloudflare/wrangler.deploy.jsonc
          fi

      - name: Final deployment
        run: npx wrangler deploy --config=field-lab/cloudflare/wrangler.deploy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          base="https://naqaa-field-lab-api.${{ vars.CLOUDFLARE_ACCOUNT_SUBDOMAIN }}"
          echo "Deployment completed. Check the Worker URL in Cloudflare if your account uses a different workers.dev subdomain."
          curl --fail-with-body --silent --show-error "$base/health"

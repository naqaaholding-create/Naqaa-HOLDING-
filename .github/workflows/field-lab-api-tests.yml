name: NAQAA Field Lab API tests

on:
  push:
    branches: [main]
    paths:
      - "field-lab/api/**"
      - ".github/workflows/field-lab-api-tests.yml"
  pull_request:
    paths:
      - "field-lab/api/**"
      - ".github/workflows/field-lab-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-lab/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: field-lab/api/requirements.txt
      - name: Install API and test dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Compile API
        run: python -m py_compile main.py
      - name: Run API tests
        run: pytest -q

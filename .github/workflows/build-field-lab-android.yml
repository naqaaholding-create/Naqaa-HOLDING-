name: Build NAQAA Field Lab Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "field-lab/**"
      - ".github/workflows/build-field-lab-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-lab
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-lab/package.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Install Capacitor dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          set -euo pipefail
          mkdir -p www
          cp *.html *.css *.js www/
          for asset in *.svg *.webmanifest; do
            if [ -f "$asset" ]; then cp "$asset" www/; fi
          done
      - name: Configure API URL for the native app when provided
        env:
          FIELD_LAB_API_BASE: ${{ vars.FIELD_LAB_API_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${FIELD_LAB_API_BASE:-}" ]; then
            echo "::warning::FIELD_LAB_API_BASE is not configured. The APK can be built for local/offline testing, but account and cloud-sync features will not work in the native app."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const raw = process.env.FIELD_LAB_API_BASE;
          const url = new URL(raw);
          if (url.protocol !== 'https:' || url.username || url.password ||
              url.pathname !== '/' || url.search || url.hash) {
            throw new Error('FIELD_LAB_API_BASE must be an HTTPS origin only, with no path, credentials, query, or fragment.');
          }
          await fs.appendFile('www/api-config.js', '\nwindow.FIELD_LAB_API_BASE = ' + JSON.stringify(url.origin) + ';\n');
          console.log('Configured HTTPS API origin for native build.');
          NODE
      - name: Add Android platform
        run: npx cap add android
      - name: Sync app assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: field-lab/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: naqaa-field-lab-debug-apk
          path: field-lab/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public Field Lab download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: field-lab-preview-run${{ github.run_number }}
          name: NAQAA Field Lab Android Preview ${{ github.run_number }}
          body: |
            Experimental Android APK for NAQAA Field Lab only.
            Debug build for device testing; not a store release.
            This release does not represent real-money payments being enabled.
          files: field-lab/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build NAQAA Field Lab Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "field-lab/**"
      - ".github/workflows/build-field-lab-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-lab
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: field-lab/package.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Validate installed dependency tree
        run: npm ls --depth=0
      - name: Validate Field Lab API Python syntax
        working-directory: .
        run: python3 -m py_compile field-lab/api/main.py field-lab/api/payments_live.py field-lab/api/payments_testnet.py field-lab/api/telegram_integration.py
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Validate Capacitor app configuration
        run: |
          node -e 'const c=require("./capacitor.config.json"); if(c.appId!=="com.naqaaholding.fieldlab" || c.appName!=="NAQAA Field Lab" || c.webDir!=="www") process.exit(1); console.log("Capacitor configuration is valid.")'
      - name: Prepare web assets
        run: mkdir -p www && cp *.html *.css *.js www/
      - name: Configure API URL for Android
        env:
          FIELD_LAB_API_BASE: ${{ vars.FIELD_LAB_API_BASE }}
        run: |
          if [ -z "$FIELD_LAB_API_BASE" ]; then
            echo "FIELD_LAB_API_BASE is not set; Android build will remain local-only for API features."
            exit 0
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const base = String(process.env.FIELD_LAB_API_BASE || "").trim().replace(/\/+$/, "");
          if (!/^https:\/\//i.test(base)) {
            console.error("FIELD_LAB_API_BASE must be an HTTPS URL.");
            process.exit(1);
          }
          const file = "www/api-config.js";
          const source = fs.readFileSync(file, "utf8");
          fs.writeFileSync(file, "window.FIELD_LAB_API_BASE_OVERRIDE = " + JSON.stringify(base) + ";\n" + source);
          console.log("Configured Android API base URL.");
          NODE
      - name: Add Android platform
        run: npx cap add android
      - name: Sync app assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: field-lab/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: naqaa-field-lab-debug-apk
          path: field-lab/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public Field Lab download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: field-lab-preview-run${{ github.run_number }}
          name: NAQAA Field Lab Android Preview ${{ github.run_number }}
          body: |
            Experimental Android APK for NAQAA Field Lab only.
            Debug build for device testing; not a store release.
            This release does not represent real-money payments being enabled.
          files: field-lab/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
